name: Pages

on:
  push:
    branches: [texh-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: wasm-pack@0.15.0
      - run: bun run build:wasm && bun run build:web
      - name: Assemble site
        run: |
          mkdir -p _site/pkg
          cp -r index.html dist _site/
          cp pkg/infty.js pkg/infty_bg.wasm _site/pkg/
      # yamllint disable-line rule:line-length
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
