name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
      # Bound software-GPU JIT memory without skipping probes.
      RUST_TEST_THREADS: "1"
      GALLIVM_PERF: nopt
      XDG_RUNTIME_DIR: /tmp/infty-xdg-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: wasm-pack@0.15.0,cargo-deny@0.20.2,shellcheck@0.11.0
      - name: Software GPU drivers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers
      - name: Prepare runtime directory
        run: mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
      - run: bun install --frozen-lockfile
      - run: git config core.hooksPath .githooks
      - run: ./check
